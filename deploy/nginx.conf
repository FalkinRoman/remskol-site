# Пример для nginx + php-fpm. Замените skolovnet.net и путь к проекту.
server {
    listen 80;
    listen [::]:80;
    server_name skolovnet.net www.skolovnet.net;
    return 301 https://skolovnet.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.skolovnet.net;
    ssl_certificate     /etc/letsencrypt/live/skolovnet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skolovnet.net/privkey.pem;
    return 301 https://skolovnet.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skolovnet.net;
    root /var/www/skolovnet/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/skolovnet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skolovnet.net/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    location ~* \.(?:webp|jpe?g|png|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }
}
